name: Python CI Pipeline

# 1. Definimos los eventos que disparan el pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. Definimos los trabajos (jobs) que se van a ejecutar
jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Usamos un runner virtual con Linux

    steps:
      # Paso 1: Descargar el código fuente del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar la versión de Python en el runner
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Paso 3: Instalar las dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Paso 4: Ejecutar las pruebas unitarias con pytest en modo verbose
      - name: Ejecutar tests con pytest
        run: |
          pytest -v
