name: Tests y PEP 8

# Se ejecuta en cada push (a cualquier rama) y en cada pull request.
on:
  push:
  pull_request:

# Si llegan dos pushes seguidos a la misma rama, se cancela la ejecución
# anterior para no gastar tiempo en una versión que ya quedó vieja.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      # Si falla una versión de Python, las demás igual terminan, así se
      # ve en cuáles falla.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      # 1. Descargar el código del repositorio.
      - name: Descargar el código
        uses: actions/checkout@v4

      # 2. Instalar Python (con caché de pip para que sea más rápido).
      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. Instalar las dependencias de requirements.txt.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Verificar PEP 8. Si flake8 encuentra algún aviso, termina con
      #    error y el pipeline queda marcado como fallido.
      - name: Verificar PEP 8 con flake8
        run: flake8 . --count --show-source --statistics

      # 5. Ejecutar todos los tests con cobertura. Falla si algún test
      #    falla o si la cobertura baja del mínimo de .coveragerc (90 %).
      - name: Ejecutar tests con pytest
        run: >
          pytest -v --cov --cov-report=term-missing
          --cov-report=xml --cov-report=html

      # 6. Guardar el reporte de cobertura para descargarlo desde la
      #    pestaña Actions (se guarda aunque los tests fallen).
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
